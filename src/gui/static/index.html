<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>DSDM Agents Console</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F4FE0'/%3E%3Cpath d='M9 22V10h5.6c3.7 0 6.4 2.4 6.4 6s-2.7 6-6.4 6H9Zm3.1-2.6h2.3c2.1 0 3.5-1.4 3.5-3.4s-1.4-3.4-3.5-3.4h-2.3v6.8Z' fill='white'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span class="brand-text">
          <strong>DSDM Agents</strong>
          <small>Delivery console</small>
        </span>
      </div>

      <nav class="nav" aria-label="Main">
        <a class="nav-item" data-route="overview" href="#/overview">
          <span class="nav-icon" aria-hidden="true">◧</span> Overview
        </a>
        <a class="nav-item" data-route="new" href="#/new">
          <span class="nav-icon" aria-hidden="true">＋</span> Start delivery
        </a>
        <a class="nav-item" data-route="activity" href="#/activity">
          <span class="nav-icon" aria-hidden="true">◷</span> Activity
          <span class="nav-badge" id="nav-active-count" hidden></span>
        </a>
        <a class="nav-item" data-route="documents" href="#/documents">
          <span class="nav-icon" aria-hidden="true">▤</span> Documents
        </a>
        <a class="nav-item" data-route="rooms" href="#/rooms">
          <span class="nav-icon" aria-hidden="true">◇</span> Delivery rooms
        </a>
        <a class="nav-item" data-route="setup" href="#/setup">
          <span class="nav-icon" aria-hidden="true">⚙</span> Setup
          <span class="nav-badge nav-badge-danger" id="nav-setup-count" hidden></span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-block" id="theme-toggle" type="button">
          <span id="theme-toggle-label">Dark mode</span>
        </button>
        <p class="sidebar-meta" id="sidebar-meta"></p>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <div class="loading-state">
        <div class="spinner" aria-hidden="true"></div>
        <p>Starting the console…</p>
      </div>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="/app.js"></script>
</body>
</html>
