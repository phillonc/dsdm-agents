[pytest]
# Pytest configuration for OPTIX Brokerage Integrations

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.4

# Add options
addopts =
    # Show test output
    -v
    --tb=short
    
    # Coverage options
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=85
    
    # Warnings
    -W ignore::DeprecationWarning
    
    # Async support
    --asyncio-mode=auto
    
    # Color output
    --color=yes
    
    # Show slowest tests
    --durations=10

# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    security: Security-related tests
    fidelity: Fidelity connector tests
    robinhood: Robinhood connector tests
    ibkr: Interactive Brokers tests
    webull: Webull connector tests
    oauth: OAuth flow tests
    portfolio: Portfolio logic tests
    sync: Sync service tests

# Coverage configuration
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
